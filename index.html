<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AURA — Más allá de lo que imaginas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" href="assets/Aura.png" as="image">
<link rel="shortcut icon" href="assets/auraminimalista.png" type="image/png">
<link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════ -->
<section id="loginScreen" class="auth-screen active">
  <div class="auth-bg"><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="bg-orb orb3"></div></div>
  <div class="auth-container">
    <div class="auth-logo">
      <img src="assets/Aura.png" class="logo-img" alt="AURA" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='block'">
      <div id="logoFallback" style="display:none;font-family:'Cinzel',serif;font-size:52px;font-weight:900;color:#D4AF37;letter-spacing:10px;text-shadow:0 0 40px rgba(204,0,0,0.5)">AURA</div>
    </div>
    <div class="auth-card">
      <h2 class="auth-title">Iniciar Sesión</h2>
      <div class="input-group">
        <span class="input-icon">✉</span>
        <input type="email" id="loginEmail" placeholder="tu@email.com" autocomplete="email">
      </div>
      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password">
        <button class="eye-btn" onclick="togglePass('loginPassword',this)">👁</button>
      </div>
      <div class="forgot-row"><button class="btn-link" onclick="forgotPassword()">¿Olvidaste tu contraseña?</button></div>
      <button class="btn-primary" onclick="loginWithEmail()">Entrar a AURA</button>
      <div class="divider"><span>o continúa con</span></div>
      <div class="social-btns">
        <button class="btn-social" onclick="loginWithGoogle()">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="btn-social" onclick="loginWithApple()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          Apple
        </button>
      </div>
      <div class="auth-switch">
        <span>¿No tienes cuenta?</span>
        <button class="btn-link gold" onclick="showScreen('registerScreen')">Crear cuenta gratis</button>
      </div>
    </div>
    <div class="dev-access">
      <p class="dev-label">⚡ Acceso rápido (dev)</p>
      <div class="dev-btns">
        <button onclick="devLogin('master')" class="dev-btn master">👑 Master</button>
        <button onclick="devLogin('admin')" class="dev-btn admin">⚙️ Admin</button>
        <button onclick="devLogin('moderador')" class="dev-btn mod">🛡️ Mod</button>
        <button onclick="devLogin('agencia')" class="dev-btn agency">🏢 Agencia</button>
        <button onclick="devLogin('streamer')" class="dev-btn streamer">🎤 Streamer</button>
        <button onclick="devLogin('usuario')" class="dev-btn user">👤 Usuario</button>
      </div>
    </div>
  </div>
</section>

<!-- ══ REGISTRO ════════════════════════════ -->
<section id="registerScreen" class="auth-screen">
  <div class="auth-bg"><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div></div>
  <div class="auth-container scrollable">
    <div class="auth-logo">
      <img src="assets/Aura.png" class="logo-img" style="width:140px" alt="AURA" onerror="this.outerHTML='<div style=\'font-family:Cinzel,serif;font-size:40px;font-weight:900;color:#D4AF37;letter-spacing:8px\'>AURA</div>'">
    </div>
    <div class="auth-card">
      <h2 class="auth-title">Crear Cuenta</h2>

      <div class="input-group">
        <span class="input-icon">👤</span>
        <input type="text" id="regNombre" placeholder="Nombre completo">
      </div>

      <div class="input-group">
        <span class="input-icon">@</span>
        <input type="text" id="regNick" placeholder="Nickname">
      </div>

      <div class="input-group">
        <span class="input-icon">✉</span>
        <input type="email" id="regEmail" placeholder="tu@email.com">
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <input type="password" id="regPassword" placeholder="Contraseña (mín. 6 caracteres)">
        <button class="eye-btn" onclick="togglePass('regPassword',this)">👁</button>
      </div>

      <div class="input-group">
        <span class="input-icon">🌍</span>
        <select id="regPais">
          <option value="">Selecciona tu país</option>
          <option>Venezuela</option><option>Colombia</option><option>México</option>
          <option>Argentina</option><option>Perú</option><option>Chile</option>
          <option>España</option><option>Estados Unidos</option><option>Brasil</option>
          <option>Ecuador</option><option>Bolivia</option><option>Paraguay</option>
          <option>Uruguay</option><option>República Dominicana</option><option>Otro</option>
        </select>
      </div>

      <div class="input-group">
        <span class="input-icon">⚤</span>
        <select id="regGenero" onchange="autoRolPorGenero(this.value)">
          <option value="">Selecciona tu género</option>
          <option value="masculino">Masculino</option>
          <option value="femenino">Femenino</option>
          <option value="otro">Prefiero no decir</option>
        </select>
      </div>

      <!-- Indicador de rol automático -->
      <div id="rolIndicador" style="display:none;padding:10px 14px;border-radius:var(--r-lg);font-size:13px;font-weight:600;text-align:center;border:1px solid"></div>

      <div class="input-group">
        <span class="input-icon">🎂</span>
        <input type="date" id="regNacimiento" onchange="verificarEdad(this.value)">
      </div>
      <div id="edadMsg" class="edad-msg" style="display:none"></div>

      <button class="btn-primary" onclick="registrarUsuario()">Unirme a AURA ✨</button>
      <div class="auth-switch">
        <span>¿Ya tienes cuenta?</span>
        <button class="btn-link gold" onclick="showScreen('loginScreen')">Iniciar sesión</button>
      </div>
    </div>
  </div>
</section>

<!-- ══ PENDIENTE ═══════════════════════════ -->
<section id="pendingScreen" class="auth-screen">
  <div class="auth-container">
    <img src="assets/auraminimalista.png" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid rgba(212,175,55,0.3)" alt="AURA" onerror="this.style.display='none'">
    <div class="auth-card" style="text-align:center">
      <div style="font-size:52px;margin-bottom:12px">⏳</div>
      <h2 class="auth-title" style="justify-content:center">Solicitud en revisión</h2>
      <p style="color:var(--mu);line-height:1.8;margin:12px 0 20px;font-size:14px">
        Nuestro equipo verificará tu identidad y activará tu cuenta de Streamer.<br>
        El proceso toma entre <strong style="color:var(--gold)">24 y 48 horas</strong>.
      </p>
      <button class="btn-primary" onclick="signOut()">Cerrar sesión</button>
    </div>
  </div>
</section>

<!-- ══ APP ═════════════════════════════════ -->
<section id="appScreen" class="auth-screen">
  <div id="sidebarOverlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo-wrap">
        <img src="assets/auraminimalista.png" class="logo-mini" alt="AURA" onerror="this.outerHTML='<span style=\'font-family:Cinzel,serif;font-size:16px;color:#D4AF37;letter-spacing:3px\'>AURA</span>'">
        <span class="sidebar-role-badge" id="sidebarRoleBadge">ROL</span>
      </div>
      <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div class="user-profile-mini" id="userProfileMini"></div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <button class="sidebar-signout" onclick="signOut()">⟵ Cerrar sesión</button>
    </div>
  </aside>
  <header class="app-header">
    <button class="menu-btn" onclick="openSidebar()">☰</button>
    <img src="assets/auraminimalista.png" class="header-logo-img" alt="AURA" onerror="this.outerHTML='<span style=\'font-family:Cinzel,serif;font-size:18px;color:#D4AF37;letter-spacing:4px\'>AURA</span>'">
    <div class="header-actions">
      <button class="header-btn" onclick="navigate('notifications')">🔔</button>
      <div class="header-avatar" id="headerAvatar" onclick="navigate('perfil')"></div>
    </div>
  </header>
  <main class="app-main" id="appMain"><div id="appContent"></div></main>
</section>

<div id="toast"></div>
<div id="globalLoader" class="global-loader">
  <img src="assets/Aura.png" class="loader-logo-img" alt="AURA" onerror="this.outerHTML='<div style=\'font-family:Cinzel,serif;font-size:44px;font-weight:900;color:#D4AF37;letter-spacing:10px\'>AURA</div>'">
  <div class="loader-bar"><div class="loader-fill"></div></div>
</div>

<script>
function showScreen(id){document.querySelectorAll('.auth-screen').forEach(s=>s.classList.remove('active'));const el=document.getElementById(id);if(el)el.classList.add('active')}
function toast(msg,type='info'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3500)}
function togglePass(id,btn){const i=document.getElementById(id);const s=i.type==='password';i.type=s?'text':'password';btn.textContent=s?'🙈':'👁'}
function verificarEdad(f){if(!f)return;const h=new Date(),n=new Date(f);let e=h.getFullYear()-n.getFullYear();if(h.getMonth()<n.getMonth()||(h.getMonth()===n.getMonth()&&h.getDate()<n.getDate()))e--;const m=document.getElementById('edadMsg');m.style.display='block';if(e<18){m.className='edad-msg error';m.textContent=`Tienes ${e} años. Debes tener al menos 18.`}else{m.className='edad-msg ok';m.textContent=`✓ ${e} años — ¡Bienvenido!`}}
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sidebarOverlay').classList.add('show')}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarOverlay').classList.remove('show')}
function showLoader(s){document.getElementById('globalLoader').style.display=s?'flex':'none'}

function autoRolPorGenero(genero) {
  const ind = document.getElementById('rolIndicador');
  if (!ind) return;
  if (genero === 'femenino') {
    ind.style.display = 'block';
    ind.style.background = 'rgba(34,197,94,0.08)';
    ind.style.borderColor = 'rgba(34,197,94,0.3)';
    ind.style.color = '#4ade80';
    ind.innerHTML = '🎤 Serás <strong>Streamer</strong> — podrás hacer lives y ganar estrellas';
  } else if (genero === 'masculino') {
    ind.style.display = 'block';
    ind.style.background = 'rgba(96,165,250,0.08)';
    ind.style.borderColor = 'rgba(96,165,250,0.3)';
    ind.style.color = '#93c5fd';
    ind.innerHTML = '👤 Serás <strong>Usuario</strong> — podrás ver lives y enviar gifts';
  } else if (genero === 'otro') {
    ind.style.display = 'block';
    ind.style.background = 'rgba(212,175,55,0.08)';
    ind.style.borderColor = 'rgba(212,175,55,0.3)';
    ind.style.color = 'var(--gold)';
    ind.innerHTML = '👤 Serás <strong>Usuario</strong> — podrás ver lives y enviar gifts';
  } else {
    ind.style.display = 'none';
  }
}
</script>

<script src="js/roles/master.js"></script>
<script src="js/roles/admin.js"></script>
<script src="js/roles/moderador.js"></script>
<script src="js/roles/agencia.js"></script>
<script src="js/roles/streamer.js"></script>
<script src="js/agora-live.js"></script>
<script src="js/firestore-actions.js"></script>
<script src="js/niveles.js"></script>
<script src="js/roles/master_reportes.js"></script>

<script src="js/test_sistema.js"></script>
<script src="js/auditoria.js"></script>

<script src="js/roles/usuario.js"></script>
<script src="js/app.js"></script>
<script type="module" src="js/firebase.js"></script>
<script>
if('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // Desregistrar SW viejo antes de registrar nuevo
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    }).finally(() => {
      navigator.serviceWorker.register('/sw.js').catch(()=>{});
    });
  });
}
</script>
</body>
</html>
